<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <!-- HTML: Table Tag (block) -->
    <!-- ตารางแบบที่ทุกแถวมีจำนวนคอลัมน์เท่ากัน -->
    <table border="1" width="400">
        <tr>
            <td>a</td>
            <td>b</td>
            <td>c</td>
            <td>d</td>
        </tr>
        <tr>
            <td>e</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
        </tr>
        <tr>
            <td>i</td>
            <td>j</td>
            <td>k</td>
            <td>j</td>
        </tr>
        <tr>
            <td>m</td>
            <td>n</td>
            <td>o</td>
            <td>p</td>
        </tr>
    </table>

    <br /><br /><br />
    <!-- ตารางแบบที่ทุกแถวมีจำนวนคอลัมน์เท่ากันบ้าง ไม่เท่ากันบ้าง -->
    <table border="1" width="400">
        <tr>
            <td colspan="2">a</td>
            <td>b</td>
            <td>c</td>
        </tr>
        <tr>
            <td rowspan="2">d</td>
            <td>e</td>
            <td colspan="2">f</td>
        </tr>
        <tr>
            <td colspan="2">g</td>
            <td rowspan="2">h</td>
        </tr>
        <tr>
            <td>i</td>
            <td>j</td>
            <td>k</td>
        </tr>
    </table>

    <br /><br /><br />
    <!-- ตารางแบบที่ทุกแถวมีจำนวนคอลัมน์เท่ากันบ้าง ไม่เท่ากันบ้าง -->
</body>

</html>
